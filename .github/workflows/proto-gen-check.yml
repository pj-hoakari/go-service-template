name: Check Generated Code

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.detect.outputs.changed }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect changes
              id: detect
              uses: ./.github/actions/detect-changes
              with:
                  paths: |
                      proto/**
                      gen/**
                      buf.yaml
                      buf.gen.go.yaml
                      go.mod
                      go.sum
                      Taskfile.yml
                      .github/workflows/proto-gen-check.yml

    proto-gen-check:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up buf
              uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
              with:
                  setup_only: true
                  version: 1.70.0
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Set up Task
              uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Lint proto
              run: task proto:lint

            - name: Regenerate connect-go code
              run: task proto:gen:go

            - name: Verify generated code is up to date
              run: |
                  if [ -n "$(git status --porcelain -- gen/)" ]; then
                    echo "::error::gen/ が最新ではありません"
                    git status --porcelain -- gen/
                    git diff -- gen/
                    exit 1
                  fi
