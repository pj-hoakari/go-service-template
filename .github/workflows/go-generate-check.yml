name: Check Go Generated Code

on:
    pull_request:
    push:
        branches: [main, with-db]

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.detect.outputs.changed }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect changes
              id: detect
              uses: ./.github/actions/detect-changes
              with:
                  paths: |
                      **/*.go
                      go.mod
                      go.sum
                      .github/workflows/go-generate-check.yml

    go-generate-check:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run generators
              run: go generate ./...

            - name: Verify generated code is up to date
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "::error::go generate の実行後に未コミットの差分があります"
                    git status --short
                    git diff
                    exit 1
                  fi
