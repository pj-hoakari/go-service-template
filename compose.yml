services:
    postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        environment:
            POSTGRES_USER: go_service_template
            POSTGRES_PASSWORD: go_service_template
            POSTGRES_DB: go_service_template
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U go_service_template -d go_service_template"]
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data

    migrate:
        image: migrate/migrate:v4.19.1@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
        command:
            [
                "-path",
                "/migrations",
                "-database",
                "postgres://go_service_template:go_service_template@postgres:5432/go_service_template?sslmode=disable",
                "up",
            ]
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./migrations:/migrations:ro

    server:
        build:
            context: .
        environment:
            DATABASE_URL: postgres://go_service_template:go_service_template@postgres:5432/go_service_template?sslmode=disable
            SERVER_ADDR: :8080
        depends_on:
            migrate:
                condition: service_completed_successfully
        ports:
            - "8080:8080"

volumes:
    postgres-data:
